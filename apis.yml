name: SequoiaDB
description: >-
  SequoiaDB (巨杉数据库) is a distributed, document-oriented NoSQL database built for
  financial-grade workloads and widely deployed across banking, insurance, securities,
  and government systems in China — running in production at more than 100 banks. A
  single cluster scales to 500 physical servers, 3.0 PB of storage, and 1.4 trillion
  rows, with remote disaster recovery targeting RPO=0 and RTO under 15 seconds. The
  platform is multi-model: a native distributed storage engine with full ACID
  transactions, a MongoDB-protocol-compatible document store (dds) with built-in
  vector indexing for AI workloads, a MySQL-compatible SQL engine (SequoiaSQL-MySQL),
  and an S3-compatible object interface (SequoiaCM). The core engine is open source
  under Apache-2.0, and access is provided through native client drivers for Java,
  Python, C, C++, PHP, and C#/.NET rather than a public HTTP REST API. SequoiaDB is
  backed by DCM Ventures and Qiming Venture Partners.
